<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Local trace browser for the Gemma eval-tampering experiment." />
    <title>Trace Lens · Gemma eval browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div>
            <h1>Trace Lens</h1>
            <p>Gemma swarm-framing trace browser</p>
          </div>
        </div>
        <div class="cohort-stats" id="cohort-stats" aria-label="Experiment summary"></div>
        <div class="header-meta">
          <span class="live-dot"></span>
          <span id="generated-at">Local snapshot</span>
        </div>
      </header>

      <main class="workspace">
        <aside class="runs-panel panel">
          <div class="panel-heading">
            <div><span class="eyebrow">Sessions</span><strong id="run-count">0 runs</strong></div>
          </div>
          <div class="filters">
            <label class="search-field">
              <span aria-hidden="true">⌕</span>
              <input id="run-search" type="search" placeholder="Find a session…" autocomplete="off" />
            </label>
            <div class="segmented" id="condition-filter" aria-label="Filter by condition">
              <button class="active" data-value="all">All</button>
              <button data-value="solo-private">Solo-framed</button>
              <button data-value="swarm-private">Swarm · private</button>
              <button data-value="swarm-shared">Swarm · shared</button>
            </div>
            <div class="segmented compact" id="outcome-filter" aria-label="Filter by outcome">
              <button class="active" data-value="all">Any result</button>
              <button data-value="disclosed">Disclosed</button>
              <button data-value="mixed">Mixed</button>
              <button data-value="suppressed">Suppressed</button>
            </div>
          </div>
          <div class="run-list" id="run-list"></div>
        </aside>

        <section class="timeline-panel panel">
          <div class="panel-heading timeline-heading">
            <div><span class="eyebrow">Trace</span><strong id="timeline-title">Choose a session</strong></div>
            <div class="view-toggle" id="view-toggle">
              <button class="active" data-value="turns">Turns</button>
              <button data-value="events">Events</button>
            </div>
          </div>
          <div class="trace-toolbar">
            <label class="search-field small">
              <span aria-hidden="true">⌕</span>
              <input id="trace-search" type="search" placeholder="Search this trace…" autocomplete="off" />
            </label>
            <select id="agent-filter" aria-label="Filter by agent" hidden></select>
            <select id="event-filter" aria-label="Filter event type" hidden></select>
          </div>
          <div class="timeline" id="timeline"></div>
          <div class="keyboard-hint"><kbd>J</kbd><kbd>K</kbd> navigate · <kbd>[</kbd><kbd>]</kbd> sessions</div>
        </section>

        <section class="detail-panel panel">
          <div class="detail-hero" id="detail-hero"></div>
          <div class="detail-tabs" id="detail-tabs"></div>
          <div class="detail-content" id="detail-content"></div>
        </section>
      </main>
    </div>
    <div class="annotation-popover" id="annotation-popover" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
