[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-swarm-misalignment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
